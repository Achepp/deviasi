<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Digital Display Panel -->
  <rect x="86" y="86" width="340" height="120" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="6"/>
  <text x="256" y="165" font-family="monospace, sans-serif" font-size="56" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="4">500.0 g</text>
  <circle cx="116" cy="116" r="6" fill="#22c55e" />
  <text x="132" y="121" font-family="sans-serif" font-size="14" fill="#94a3b8">IN SPEC</text>

  <!-- Scale Platform & Base -->
  <path d="M 64 340 L 448 340 L 410 400 L 102 400 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="180" y="240" width="152" height="100" rx="10" fill="#cbd5e1"/>
  
  <!-- Package on Platform -->
  <rect x="166" y="220" width="180" height="110" rx="16" fill="url(#goldGrad)" stroke="#0284c7" stroke-width="4"/>
  <path d="M 166 260 L 346 260" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Checkmark badge on package -->
  <circle cx="256" cy="275" r="24" fill="#10b981"/>
  <path d="M 244 275 L 252 283 L 268 267" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
